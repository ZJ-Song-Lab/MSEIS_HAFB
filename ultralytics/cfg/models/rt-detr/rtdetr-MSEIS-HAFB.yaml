# RT-DETR-l object detection model with MSEIS and HAFB modules for SAR ship detection

# Parameters
nc: 1  # number of classes (ship)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 1, CSP_MultiScaleEdgeInformationSelect, [128]]  # 2-P2/4 with MSEIS
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 1, CSP_MultiScaleEdgeInformationSelect, [256]]  # 4-P3/8 with MSEIS
  - [-1, 1, Conv, [384, 3, 2]]  # 5-P4/16
  - [-1, 1, CSP_MultiScaleEdgeInformationSelect, [384]]  # 6-P4/16 with MSEIS
  - [-1, 1, Conv, [384, 3, 2]]  # 7-P5/32
  - [-1, 3, CSP_MultiScaleEdgeInformationSelect, [384]]  # 8-P5/32 with MSEIS

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 10
  - [-1, 1, Conv, [256, 1, 1]]  # 11, Y5, lateral_convs.0

  # Top-down path with Hierarchical Attention Fusion Block
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 13 input_proj.1
  - [[-2, -1], 1, HierarchicalAttentionFusionBlock, [256]]  # 14 Y4, fuse Y5 and P4 with HAFB

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 16 input_proj.0
  - [[-2, -1], 1, HierarchicalAttentionFusionBlock, [256]]  # 17 F3, fuse Y4 and P3 with HAFB

  # Bottom-up path with Hierarchical Attention Fusion Block
  - [-1, 1, Conv, [256, 3, 2]]   # 18, downsample_convs.0
  - [[-1, 14], 1, HierarchicalAttentionFusionBlock, [256]]  # 19 F4, fuse F3 and Y4 with HAFB

  - [-1, 1, Conv, [256, 3, 2]]   # 20, downsample_convs.1
  - [[-1, 11], 1, HierarchicalAttentionFusionBlock, [256]]  # 21 F5, fuse F4 and Y5 with HAFB

  - [[17, 19, 21], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)